<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0F0E0C">
<title>Escapade — swipe, matchez, partez</title>
<style>
  :root{
    --bg:#0F0E0C; --card:#1A1815; --card2:#231F1A; --line:#332D25;
    --ink:#F4EFE6; --muted:#9A9184; --accent:#DFFF3E; --accent2:#FF7A45;
    --ok:#5BE49B; --no:#FF5C5C;
    --r:26px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overscroll-behavior:none; -webkit-font-smoothing:antialiased;
    display:flex; flex-direction:column;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  body::before{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:0;
    background:
      radial-gradient(120% 60% at 50% -10%, rgba(223,255,62,.10), transparent 60%),
      radial-gradient(90% 50% at 100% 100%, rgba(255,122,69,.08), transparent 60%);
  }
  header{position:relative; z-index:2; padding:14px 18px 6px; display:flex; align-items:center; gap:10px}
  .logo{font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing:.14em; text-transform:uppercase}
  .logo b{color:var(--accent)}
  .spacer{flex:1}
  .ghost{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:999px; padding:7px 12px; font-size:12.5px; letter-spacing:.02em;
  }
  .ghost:active{transform:scale(.97)}
  /* chips destinations */
  .dests{position:relative; z-index:2; display:flex; gap:8px; padding:8px 18px 0; overflow-x:auto; scrollbar-width:none}
  .dests::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; border:1px solid var(--line); background:var(--card); color:var(--muted);
    border-radius:999px; padding:9px 14px; font-size:13.5px; display:flex; gap:7px; align-items:center;
    transition:.18s ease;
  }
  .chip[aria-selected="true"]{background:var(--accent); border-color:var(--accent); color:#141310; font-weight:600}
  /* scène */
  main{position:relative; z-index:1; flex:1; display:flex; flex-direction:column; min-height:0}
  .stage{position:relative; flex:1; margin:14px 16px 0; min-height:0}
  .card{
    position:absolute; inset:0; border-radius:var(--r); overflow:hidden;
    background:var(--card); border:1px solid var(--line);
    box-shadow:0 24px 60px -30px rgba(0,0,0,.9), 0 2px 0 rgba(255,255,255,.03) inset;
    will-change:transform; touch-action:none; user-select:none;
    display:flex; flex-direction:column;
  }
  .card .art{position:relative; flex:1; min-height:0; display:grid; place-items:center; overflow:hidden}
  .card[data-depth="1"]{transform:scale(.955) translateY(11px); opacity:.9}
  .card[data-depth="2"]{transform:scale(.91) translateY(22px); opacity:.55}
  .card[data-cat="culture"] .art{background:radial-gradient(75% 65% at 50% 42%, rgba(223,255,62,.13), transparent 72%)}
  .card[data-cat="food"] .art{background:radial-gradient(75% 65% at 50% 42%, rgba(255,122,69,.15), transparent 72%)}
  .card[data-cat="nature"] .art{background:radial-gradient(75% 65% at 50% 42%, rgba(91,228,155,.13), transparent 72%)}
  .card[data-cat="night"] .art{background:radial-gradient(75% 65% at 50% 42%, rgba(124,199,255,.14), transparent 72%)}
  .card .art .glyph{font-size:clamp(76px,26vw,120px); filter:drop-shadow(0 12px 30px rgba(0,0,0,.5))}
  .card .art .rings{position:absolute; inset:-30%; opacity:.5;
    background:repeating-radial-gradient(circle at 50% 55%, transparent 0 26px, rgba(255,255,255,.045) 26px 27px);
  }
  .card .body{padding:16px 18px 18px; border-top:1px solid var(--line); background:linear-gradient(180deg, rgba(26,24,21,.6), var(--card))}
  .kicker{display:flex; gap:8px; align-items:center; color:var(--muted); font:600 11px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase}
  h2{margin:8px 0 4px; font:600 25px/1.12 "Iowan Old Style",Palatino,Georgia,serif; letter-spacing:-.01em}
  .meta{color:var(--muted); font-size:13.5px}
  .tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px}
  .tag{font-size:11.5px; padding:5px 9px; border-radius:999px; background:var(--card2); border:1px solid var(--line); color:#CFC6B8}
  .grp{display:flex; align-items:center; gap:8px; margin-top:13px; padding-top:12px; border-top:1px dashed var(--line)}
  .avs{display:flex}
  .av{width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font:600 11px/1 ui-monospace,monospace; color:#141310; margin-left:-7px; border:2px solid var(--card)}
  .av:first-child{margin-left:0}
  .av.y{background:var(--ok)} .av.n{background:#4A443B; color:#B9B0A2}
  .grp .lbl{font-size:12.5px; color:var(--muted)}
  /* tampons like/nope */
  .stamp{
    position:absolute; top:22px; padding:8px 12px; border:2.5px solid; border-radius:10px;
    font:800 18px/1 ui-monospace,monospace; letter-spacing:.08em; opacity:0; transition:opacity .1s;
  }
  .stamp.like{right:18px; color:var(--ok); border-color:var(--ok); transform:rotate(9deg)}
  .stamp.nope{left:18px; color:var(--no); border-color:var(--no); transform:rotate(-9deg)}
  .stamp.must{left:50%; top:auto; bottom:26%; transform:translateX(-50%) rotate(-4deg); color:var(--accent); border-color:var(--accent)}
  /* actions */
  .actions{position:relative; z-index:3; display:flex; justify-content:center; align-items:center; gap:16px; padding:16px 18px 10px}
  .btn{
    width:60px; height:60px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--ink); font-size:22px; display:grid; place-items:center; transition:transform .12s, background .12s;
  }
  .btn:active{transform:scale(.92)}
  .btn.no{color:var(--no); width:54px; height:54px}
  .btn.yes{color:var(--ok); width:54px; height:54px}
  .btn.must{color:var(--accent); width:46px; height:46px; font-size:16px}
  .hint{position:relative; z-index:2; text-align:center; color:var(--muted); font-size:12px; padding:0 20px 14px; min-height:20px}
  /* résultat */
  .result{display:none; flex:1; min-height:0; overflow-y:auto; padding:6px 16px 24px; -webkit-overflow-scrolling:touch}
  .result.on{display:block}
  body[data-view="result"] main{display:none}
  .result h3{font:600 27px/1.1 "Iowan Old Style",Palatino,Georgia,serif; margin:6px 0 4px}
  .stats{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:14px 0 6px}
  .stat{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:12px}
  .stat b{display:block; font:600 21px/1.1 ui-monospace,monospace; letter-spacing:-.02em}
  .stat span{font-size:11.5px; color:var(--muted); text-transform:uppercase; letter-spacing:.08em}
  .mapwrap{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:8px; margin:12px 0}
  .day{background:var(--card); border:1px solid var(--line); border-radius:18px; padding:14px 15px; margin:10px 0}
  .day h4{margin:0 0 10px; font:600 12px/1 ui-monospace,monospace; letter-spacing:.14em; text-transform:uppercase; color:var(--accent)}
  .stop{display:flex; gap:11px; padding:8px 0; border-top:1px solid #262119}
  .stop:first-of-type{border-top:0}
  .n{flex:0 0 22px; height:22px; border-radius:50%; background:var(--card2); display:grid; place-items:center; font:600 11px/1 ui-monospace,monospace; color:var(--muted)}
  .stop .t{flex:1; min-width:0}
  .stop .t b{display:block; font-weight:600; font-size:14.5px}
  .stop .t i{font-style:normal; color:var(--muted); font-size:12.5px}
  .stop .p{font:600 12.5px/1.4 ui-monospace,monospace; color:var(--muted)}
  .solo{margin-top:10px; padding:12px 14px; border:1px dashed var(--line); border-radius:16px; color:var(--muted); font-size:13px}
  .solo b{color:var(--ink)}
  .foot{margin-top:16px; color:#6E675C; font-size:11.5px; line-height:1.5}
  .res-actions{display:flex; gap:10px; margin-top:14px}
  .res-actions button{flex:1; padding:13px; border-radius:14px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:14px}
  .res-actions .primary{background:var(--accent); color:#141310; border-color:var(--accent); font-weight:600}
  /* vide / fin */
  .done{position:absolute; inset:0; display:none; place-items:center; text-align:center; padding:30px}
  .done.on{display:grid}
  .done .glyph{font-size:54px}
  .done p{color:var(--muted); max-width:28ch; margin:10px auto 0}
  .done button{margin-top:18px; padding:13px 20px; border-radius:14px; border:0; background:var(--accent); color:#141310; font-weight:600; font-size:15px}
  @media (min-width:640px){ .stage{max-width:420px; margin:14px auto 0; width:100%} .actions{max-width:420px; margin:0 auto; width:100%} }
  @media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }
</style>
</head>
<body>
<header>
  <div class="logo">Esca<b>pade</b></div>
  <div class="spacer"></div>
  <button class="ghost" id="reset">Recommencer</button>
</header>

<nav class="dests" id="dests" aria-label="Destination"></nav>

<main>
  <div class="stage" id="stage" aria-live="polite"></div>
  <div class="done" id="done">
    <div>
      <div class="glyph">🧭</div>
      <h3 style="font:600 24px/1.15 'Iowan Old Style',Palatino,Georgia,serif;margin:10px 0 0">Plus de cartes</h3>
      <p id="doneMsg">Tu as tout passé en revue.</p>
      <button id="toResult">Voir l'itinéraire</button>
    </div>
  </div>

  <div class="actions" id="actions">
    <button class="btn no" id="btnNo" aria-label="Passer">✕</button>
    <button class="btn must" id="btnMust" aria-label="Incontournable">★</button>
    <button class="btn yes" id="btnYes" aria-label="J'aime">♥</button>
  </div>
  <div class="hint" id="hint">Glisse la carte, ou utilise les boutons</div>
</main>

<section class="result" id="result"></section>

<script type="module">
/* ============================================================
   Escapade — hommage aux apps de planification de voyage à swipe
   Tout est client-side : aucune requête réseau, aucune donnée
   ne quitte l'appareil. Les distances sont à vol d'oiseau.
   ============================================================ */

    spots: [

/* Profils du groupe — chaque ami a un goût et un biais déterministe */
const FRIENDS = [
  {id:"el",  name:"Élisabeth", initials:"ÉL", color:"#DFFF3E", w:{culture:1.5, food:1.1, nature:1.0, night:.6}, seed:17},
  {id:"ine", name:"Inès",      initials:"IN", color:"#FF9EC4", w:{culture:.8, food:1.0, nature:1.1, night:1.6}, seed:41},
  {id:"abe", name:"Abel",      initials:"AB", color:"#7CC7FF", w:{culture:.7, food:1.3, nature:1.6, night:.3}, seed:73}
];

const DAY_BUDGET = 330;      // minutes de visite par jour
const MATCH_RULE = 2;        // sur 3 amis

/* ---------- fonctions pures (testables isolément) ---------- */

export function haversine(a, b){ // km, a et b = [lat, lon]
  const R = 6371, toRad = d => d * Math.PI / 180;
  const dLat = toRad(b[0]-a[0]), dLon = toRad(b[1]-a[1]);
  const s = Math.sin(dLat/2)**2 + Math.cos(toRad(a[0]))*Math.cos(toRad(b[0]))*Math.sin(dLon/2)**2;
  return 2 * R * Math.asin(Math.min(1, Math.sqrt(s)));
}

export function hash01(str, seed){ // déterministe dans [0,1)
  let h = 2166136261 ^ seed;
  for (let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return ((h >>> 0) % 100000) / 100000;
}

export function friendVotes(spot){
  // Chaque ami a une probabilité d'aimer = 0,18 + 0,32 × son goût pour la catégorie,
  // tirée sur un bruit déterministe (même lieu + même ami = même vote, toujours).
  return FRIENDS.map(f => {
    const w = f.w[spot.cat] ?? 1;
    const p = Math.min(0.92, 0.18 + 0.32 * w);
    return { id:f.id, name:f.name, initials:f.initials, color:f.color, likes: hash01(spot.id, f.seed) < p };
  });
}

export function groupCount(spot){ return friendVotes(spot).filter(v=>v.likes).length; }

export function nearestRoute(base, spots){ // base [lat,lon], spots objets avec lat/lon -> ordre + km
  const left = spots.slice(), order = [];
  let cur = base, total = 0;
  while (left.length){
    let bi = 0, bd = Infinity;
    left.forEach((s,i) => { const d = haversine(cur, [s.lat, s.lon]); if (d < bd){ bd = d; bi = i; } });
    const next = left.splice(bi,1)[0];
    total += bd; order.push(next); cur = [next.lat, next.lon];
  }
  return { order, km: total };
}

export function planDays(base, spots, budget = DAY_BUDGET){
  // répartit en journées : on remplit une journée tant que ça tient, puis on repart du dernier point
  if (!spots.length) return { days: [], km: 0 };
  const { order } = nearestRoute(base, spots);
  const days = []; let cur = [], load = 0;
  for (const s of order){
    if (load + s.dur > budget && cur.length){ days.push(cur); cur = []; load = 0; }
    cur.push(s); load += s.dur;
  }
  if (cur.length) days.push(cur);
  let km = 0, from = base;
  days.forEach(d => { d.forEach(s => { km += haversine(from, [s.lat, s.lon]); from = [s.lat, s.lon]; }); });
  return { days, km };
}

export function totals(days){
  let dur = 0, price = 0, n = 0;
  days.forEach(d => d.forEach(s => { dur += s.dur; price += s.price; n++; }));
  return { dur, price, n };
}

/* ---------- état + rendu ---------- */

const S = { dest:"bayonne", i:0, liked:[], passed:[] };
const el = id => document.getElementById(id);
const stage = el("stage"), result = el("result"), hint = el("hint");

function spots(){ return DATA[S.dest].spots; }
function remaining(){ return spots().length - S.i; }

function fmtDur(m){ const h = Math.floor(m/60), r = m%60; return h ? (r? `${h} h ${String(r).padStart(2,"0")}` : `${h} h`) : `${r} min`; }
function fmtKm(k){ return k < 1 ? `${Math.round(k*1000)} m` : `${k.toFixed(1)} km`; }

function cardHTML(spot, depth){
  const votes = friendVotes(spot), yes = votes.filter(v=>v.likes).length;
  const av = votes.map(v => `<span class="av ${v.likes?"y":"n"}" title="${v.name}">${v.initials}</span>`).join("");
  return `<article class="card" data-depth="${depth}" data-cat="${spot.cat}">
    <div class="art"><div class="rings"></div><div class="glyph">${spot.glyph}</div>
      <div class="stamp like">J'AIME</div><div class="stamp nope">NON</div><div class="stamp must">★</div>
    </div>
    <div class="body">
      <div class="kicker"><span>${DATA[S.dest].name}</span>·<span>${spot.cat}</span></div>
      <h2>${spot.name}</h2>
      <div class="meta">${fmtDur(spot.dur)} · ${spot.price ? spot.price+" €" : "gratuit"}</div>
      <div class="tags">${spot.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div>
      <div class="grp"><div class="avs">${av}</div><span class="lbl">${yes}/3 du groupe aiment</span></div>
    </div>
  </article>`;
}

function renderDeck(){
  const list = spots().slice(S.i, S.i+3).reverse();
  stage.innerHTML = list.map((s,k) => cardHTML(s, list.length-1-k)).join("");
  const top = stage.querySelector('[data-depth="0"]');
  if (top) attachDrag(top);
  hint.textContent = remaining() ? `${remaining()} lieu${remaining()>1?"x":""} à passer en revue` : "";
  el("done").classList.toggle("on", remaining() === 0);
  el("actions").style.opacity = remaining() ? 1 : .25;
}

let drag = null;
function attachDrag(card){
  const art = card.querySelector(".art");
  const like = card.querySelector(".stamp.like"), nope = card.querySelector(".stamp.nope"), must = card.querySelector(".stamp.must");
  card.addEventListener("pointerdown", e => {
    if (e.button && e.button !== 0) return;
    drag = { x0:e.clientX, y0:e.clientY, dx:0, dy:0, id:e.pointerId, card, like, nope, must };
    card.setPointerCapture(e.pointerId); card.style.transition = "none";
  });
  card.addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    drag.dx = e.clientX - drag.x0; drag.dy = e.clientY - drag.y0;
    const rot = drag.dx / 14, lift = Math.max(0, -drag.dy);
    card.style.transform = `translate(${drag.dx}px, ${drag.dy}px) rotate(${rot}deg)`;
    like.style.opacity = Math.min(1, Math.max(0, drag.dx / 90));
    nope.style.opacity = Math.min(1, Math.max(0, -drag.dx / 90));
    must.style.opacity = Math.min(1, Math.max(0, lift / 110)) * (Math.abs(drag.dx) < 60 ? 1 : 0);
  });
  const end = (e) => {
    if (!drag) return;
    const { dx, dy } = drag; const c = drag.card; drag = null;
    c.style.transition = "transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s";
    if (dy < -110 && Math.abs(dx) < 70) return decide("must");
    if (dx > 90) return decide("like");
    if (dx < -90) return decide("nope");
    c.style.transform = ""; c.querySelectorAll(".stamp").forEach(s=>s.style.opacity = 0);
  };
  card.addEventListener("pointerup", end);
  card.addEventListener("pointercancel", end);
}

function decide(kind){
  const spot = spots()[S.i];
  if (!spot) return;
  const card = stage.querySelector('[data-depth="0"]');
  const votes = friendVotes(spot), yes = votes.filter(v=>v.likes).length;
  const isMatch = kind !== "nope" && (kind === "must" || yes >= MATCH_RULE);
  if (kind !== "nope") S.liked.push({ spot, kind, yes, isMatch });
  else S.passed.push(spot.id);
  if (card){
    const tx = kind === "nope" ? -520 : kind === "must" ? 0 : 520;
    const ty = kind === "must" ? -620 : 0;
    card.style.transform = `translate(${tx}px, ${ty}px) rotate(${kind==="nope"?-18:18}deg)`;
    card.style.opacity = "0";
  }
  nav();
  if (navigator.vibrate) navigator.vibrate(kind === "must" ? [12,40,18] : 10);
  S.i++; setTimeout(() => { renderDeck(); }, 180);
}

/* résultat */
function showResult(){
  const liked = S.liked.map(x => x.spot);
  if (!liked.length){
    result.innerHTML = `<h3>Rien de retenu</h3><p class="meta">Tout ce que tu as swipé est passé. Relance une destination avec l'autre bouton.</p>`;
    result.classList.add("on");
    return;
  }
  // L'itinéraire ne retient que ce que le groupe a validé. Les envies solo sont listées à part.
  const matchedSpots = S.liked.filter(x => x.isMatch).map(x => x.spot);
  const fallback = matchedSpots.length === 0;
  const use = fallback ? liked : matchedSpots;
  const { days, km } = planDays(DATA[S.dest].base, use);
  const t = totals(days);
  const matches = matchedSpots.length;
  const solos = S.liked.filter(x => !x.isMatch);

  const pts = days.flat();
  const lats = pts.map(p=>p.lat), lons = pts.map(p=>p.lon);
  const minLat = Math.min(...lats), maxLat = Math.max(...lats);
  const meanLat = (minLat + maxLat) / 2;
  const cosf = Math.cos(meanLat * Math.PI / 180);      // corrige l'écrasement est-ouest
  const xs = lons.map(l => l * cosf);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const W = 320, H = 210, pad = 26;
  const px = v => pad + (maxX===minX ? W/2-pad : (v - minX)/(maxX-minX)*(W-2*pad));
  const py = v => pad + (maxLat===minLat ? H/2-pad : (maxLat - v)/(maxLat-minLat)*(H-2*pad));
  const colors = ["#DFFF3E","#FF7A45","#7CC7FF","#FF9EC4","#5BE49B"];
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Carte schématique du trajet">`;
  svg += `<rect width="${W}" height="${H}" rx="12" fill="#141311"/>`;
  days.forEach((d,di) => {
    const col = colors[di % colors.length];
    const path = d.map(s => `${px(s.lon*cosf)},${py(s.lat)}`).join(" ");
    svg += `<polyline points="${path}" fill="none" stroke="${col}" stroke-width="1.6" stroke-dasharray="4 4" opacity=".85"/>`;
    d.forEach((s) => {
      const cx = px(s.lon*cosf), cy = py(s.lat);
      svg += `<circle cx="${cx}" cy="${cy}" r="8.5" fill="${col}" opacity=".16"/>`;
      svg += `<circle cx="${cx}" cy="${cy}" r="3.4" fill="${col}"/>`;
    });
    const f = d[0];
    svg += `<text x="${px(f.lon*cosf)+9}" y="${py(f.lat)+13}" font-size="8" fill="${col}" font-family="ui-monospace,monospace">J${di+1}</text>`;
  });
  svg += `</svg>`;

  const dayHTML = days.map((d, i) => `
    <div class="day">
      <h4>Jour ${i+1} · ${fmtDur(d.reduce((a,s)=>a+s.dur,0))}</h4>
      ${d.map((s, k) => `<div class="stop"><div class="n">${k+1}</div>
        <div class="t"><b>${s.glyph} ${s.name}</b><i>${fmtDur(s.dur)} · ${s.tags.join(" · ")}</i></div>
        <div class="p">${s.price ? s.price+" €" : "—"}</div></div>`).join("")}
    </div>`).join("");

  result.innerHTML = `
    <h3>${DATA[S.dest].name}, ${days.length} jour${days.length>1?"s":""}</h3>
    <div class="meta">Départ : ${DATA[S.dest].hotel}${fallback ? "" : " · " + matches + " lieu" + (matches>1?"x":"") + " validé" + (matches>1?"s":"") + " par le groupe"}</div>
    <div class="stats">
      <div class="stat"><b>${t.n}</b><span>lieux</span></div>
      <div class="stat"><b>${fmtKm(km)}</b><span>à pied</span></div>
      <div class="stat"><b>${t.price} €</b><span>entrées</span></div>
    </div>
    <div class="mapwrap">${svg}</div>
    ${dayHTML}
    ${fallback ? `<div class="solo"><b>Aucun lieu validé par le groupe.</b> L'itinéraire ci-dessus est donc ton choix personnel, sans consensus — à valider avec les autres avant de réserver.</div>` : ""}
    ${solos.length && !fallback ? `<div class="solo"><b>${solos.length} envie${solos.length>1?"s":""} perso</b> hors itinéraire, que le groupe n'a pas validée${solos.length>1?"s":""} : ${solos.map(x=>x.spot.name).join(", ")}. À caser si vous changez d'avis.</div>` : ""}
    <div class="res-actions"><button id="again">Changer de destination</button><button class="primary" id="copy">Copier le plan</button></div>
    <p class="foot">Escapade est une démo : distances à vol d'oiseau, durées et prix indicatifs, horaires non vérifiés. Les votes du groupe sont simulés de façon reproductible. Aucune donnée ne sort de l'appareil.</p>`;

  result.classList.add("on");
  document.body.dataset.view = "result";
  el("done").classList.remove("on");
  result.scrollTop = 0;
  el("copy").onclick = () => {
    const txt = `${DATA[S.dest].name} — ${days.length} jour(s)\n` + days.map((d,i)=>`\nJour ${i+1}\n` + d.map((s,k)=>` ${k+1}. ${s.name} (${fmtDur(s.dur)})`).join("\n")).join("\n");
    navigator.clipboard?.writeText(txt).then(()=>{ el("copy").textContent = "Copié ✓"; }).catch(()=>{ el("copy").textContent = "Copie refusée"; });
  };
  el("again").onclick = () => { result.classList.remove("on"); delete document.body.dataset.view; S.i = 0; S.liked = []; S.passed = []; renderDeck(); };
}

/* navigation */
function nav(){
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-selected", c.dataset.d === S.dest));
}
function setDest(d){
  S.dest = d; S.i = 0; S.liked = []; S.passed = [];
  result.classList.remove("on"); delete document.body.dataset.view;
  renderDeck(); nav();
}
el("dests").innerHTML = Object.entries(DATA).map(([k,v],i) =>
  `<button class="chip" data-d="${k}" aria-selected="${i===0}">${v.name}</button>`).join("");
el("dests").addEventListener("click", e => { const b = e.target.closest(".chip"); if (b) setDest(b.dataset.d); });
el("btnNo").onclick  = () => decide("nope");
el("btnYes").onclick = () => decide("like");
el("btnMust").onclick= () => decide("must");
el("toResult").onclick = showResult;
el("reset").onclick = () => setDest(S.dest);
addEventListener("keydown", e => {
  if (result.classList.contains("on")) return;
  if (e.key === "ArrowRight") decide("like");
  if (e.key === "ArrowLeft")  decide("nope");
  if (e.key === "ArrowUp")    decide("must");
});
result.addEventListener("click", e => { if (e.target.id === "again") {} });

renderDeck();
nav();
</script>
</body>
</html>
